<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Simples</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="box">
    <h2>Calculadora</h2>

    <div class="campo">
      <label for="numero1">Primeiro número:</label>
      <input type="number" id="numero1" placeholder="Digite um valor">
    </div>

    <div class="campo">
      <label for="numero2">Segundo número:</label>
      <input type="number" id="numero2" placeholder="Digite outro valor">
    </div>

    <div class="botoes">
      <button id="btnSomar" class="btn-op btn-somar">+</button>
      <button id="btnSubtrair" class="btn-op btn-subtrair">−</button>
      <button id="btnMultiplicar" class="btn-op btn-multiplicar">×</button>
    </div>

    <p id="resultado">O resultado aparecerá aqui.</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
